name: Neo Emerald - free GBA prototype build

on:
  push:
    branches:
      - neo-emerald/mossdeep-city-v3-streets
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-emerald-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/neo-emerald/mossdeep-city-v3-streets'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install free open-source GBA build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi libpng-dev pkg-config python3 git

      - name: Compile Neo Emerald (save full diagnostic log)
        shell: bash
        run: |
          mkdir -p neo_emerald/out
          set -o pipefail
          JOBS=2 bash neo_emerald/tools/build.sh 2>&1 | tee neo_emerald/out/build.log

      - name: Verify output and write checksum
        if: success()
        shell: bash
        run: |
          test -s neo_emerald/out/NeoEmerald_Prototype.gba
          file neo_emerald/out/NeoEmerald_Prototype.gba
          sha256sum neo_emerald/out/NeoEmerald_Prototype.gba | tee neo_emerald/out/NeoEmerald_Prototype.sha256

      - name: Upload compiler log for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo-emerald-build-log-${{ github.run_number }}
          path: neo_emerald/out/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GBA prototype for Delta
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neo-emerald-gba-${{ github.run_number }}
          path: |
            neo_emerald/out/NeoEmerald_Prototype.gba
            neo_emerald/out/NeoEmerald_Prototype.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
